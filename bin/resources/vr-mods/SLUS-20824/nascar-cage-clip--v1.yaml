SLUS-20824:
  - name: "Cockpit cage fix"
    description: "Stops the roll cage drawing mirrored when you turn your head in the cockpit."
    origin: PenguinVR
    kind: fix
    version: "1"
    crcs: [0x612542D0]
    enabled: true
    # It changes only this machine's picture, so it may run in a networked match.
    netplay:
      effect: local
      runs_in: [offline, lan, online]
    # The cockpit cage is drawn by VU1 entry 0x1158 of program 0x0036C260, which never clips:
    # geometry behind the eye comes out mirrored once the view turns (head look, or any camera
    # inside the cabin). CAGE (155 instructions at micro 0x3738, unused by the game) builds the same
    # strip with the game's own routines and hands the triangles that cross the eye plane or the
    # guard box to the game's own clipper (0x2D50). Straight ahead it draws exactly what 0x1158 draws.
    guards:
      - { address: 0x0022733C, equals: 0x3C020038, width: 4 }
      - { address: 0x00227344, equals: 0x24424C28, width: 4 }
      - { address: 0x00384C34, equals: 0x00002F00, width: 4 }
    vu1:
      - micro: 0x3738
        match:
          - { micro: 0x0B80, words: [0x8000033C, 0x01E00283, 0x5C004034, 0x000002FF] }
          - { micro: 0x0ED8, words: [0x10010340, 0x01E001C3, 0x5C004031, 0x01E00203] }
