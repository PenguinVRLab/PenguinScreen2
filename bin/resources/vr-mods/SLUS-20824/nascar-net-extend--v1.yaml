SLUS-20824:
  - name: "Longer window net"
    description: "Extends the window net further back behind the original net."
    origin: PenguinVR
    kind: fix
    version: "1"
    crcs: [0x612542D0]
    enabled: true
    # It changes only this machine's picture, so it may run in a networked match.
    netplay:
      effect: local
      runs_in: [offline, lan, online]
    # The original net stays where it is. nt04_net_extend.s draws cockpit mesh 8 a second time, through a
    # two-entry list of ours: a copy of batch 0 with its positions zeroed (keeps the material order) and five
    # more copies of the net's rear section, each moved back by the section's own length. The data is
    # mesh_probe.py netext's output, built offline from a stock dump; it is the same in every boot.
    # Only mesh 8 of the cockpit model *(0x00448AB8) gets the second draw.
    guards:
      - { address: 0x00256414, equals: 0x26100002, width: 4 }
