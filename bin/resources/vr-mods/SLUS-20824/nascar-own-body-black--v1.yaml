SLUS-20824:
  - name: "Own car body in the cockpit"
    description: "Draws your own car's body, in black, around you in the cockpit views."
    origin: PenguinVR
    kind: fix
    version: "1"
    crcs: [0x612542D0]
    enabled: true
    # It changes only this machine's picture, so it may run in a networked match.
    netplay:
      effect: local
      runs_in: [offline, lan, online]
    # From the cockpit the game draws no car around the driver. 0x00219EB8 (nop) draws the camera's own car;
    # the near and far body caves give that car alone a private VU1 entry table of BLACK stubs (black where
    # the texture is opaque, see-through where it is not) and skip its exterior driver (part 2) and side glass
    # (part 28). Every other car draws as stock. The car loop names the camera's own car only for camera
    # types 2, 3 and 17 (Bumper, Cockpit, one more), so the chase cameras are untouched.
    guards:
      - { address: 0x00217E4C, equals: 0xAE260024, width: 4 }
      - { address: 0x002180F8, equals: 0x0C095E92, width: 4 }
    vu1:
      - micro: 0x3C10
        # BLACK stubs (nt04_black_stubs.vu, 104 instructions): ALPHA -> 0x46 = (0 - Cd) * As + Cd and
        # PRMODE |= ABE in the batch's GS header at TOP-9, then the stock entry.
        match:
          - { micro: 0x1158, words: [0x800A06BC, 0x000002FF, 0x100B50C0, 0x000002FF] }
          - { micro: 0x1228, words: [0x800A06BC, 0x000002FF, 0x100B50C0, 0x000002FF] }
